<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOMAFITX | Sitio en Mantenimiento</title>
  <style>
    :root {
      --bg-dark: #05050b;
      --bg-card: #0b0b16;
      --text-main: #ffffff;
      --text-muted: #a3a8c2;
      --neon-purple: #8b2cf5;
      --neon-blue: #0066ff;
      --neon-cyan: #00a8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #05050a 0%, #0a0a14 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(115px);
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: var(--neon-blue);
      top: -120px;
      left: -80px;
    }

    body::after {
      background: var(--neon-purple);
      bottom: -120px;
      right: -80px;
    }

    .mantenimiento-card {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      background: rgba(11, 11, 22, 0.92);
      border: 1px solid rgba(0, 168, 255, 0.35);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: -10px 0 38px rgba(139, 44, 245, 0.32), 10px 0 38px rgba(0, 102, 255, 0.32);
    }

    .visual-wrap {
      position: relative;
      width: 210px;
      height: 195px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-principal {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: contain;
      background: radial-gradient(circle, #141428 0%, #05050b 100%);
      padding: 5px;
      border: 3px solid transparent;
      background-image: linear-gradient(#080812, #080812), linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 24px rgba(0, 168, 255, 0.35);
    }

    .engrane-badge {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #080814;
      border: 1.5px solid rgba(0, 168, 255, 0.55);
      box-shadow: 0 0 18px rgba(139, 44, 245, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .engrane-svg {
      width: 38px;
      height: 38px;
      animation: girarEngrane 7s linear infinite;
      transform-origin: center;
    }

    @keyframes girarEngrane {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .lifter-badge {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #080814;
      border: 1.5px solid rgba(139, 44, 245, 0.65);
      box-shadow: 0 0 20px rgba(0, 168, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lifter-svg {
      width: 74px;
      height: 74px;
    }

    .barra-pesas {
      animation: levantarPesas 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    .cuerpo-monito {
      animation: esfuerzoMonito 1.8s ease-in-out infinite;
      transform-origin: 37px 54px;
    }

    @keyframes levantarPesas {
      0%, 100% {
        transform: translateY(8px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes esfuerzoMonito {
      0%, 100% {
        transform: scaleY(0.95);
      }
      50% {
        transform: scaleY(1.03);
      }
    }

    .badge-estado {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      background: rgba(0, 168, 255, 0.1);
      border: 1px solid rgba(0, 168, 255, 0.35);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .acciones {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-principal,
    .btn-secundario {
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn-principal {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(139, 44, 245, 0.42);
    }

    .btn-secundario {
      background: rgba(17, 17, 34, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(0, 168, 255, 0.4);
    }

    .btn-principal:hover,
    .btn-secundario:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .lema {
      margin-top: 26px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    .lema span {
      color: var(--neon-purple);
      margin: 0 8px;
    }
  </style>
</head>
<body>
  <main class="mantenimiento-card">
    <div class="visual-wrap">
      <img
        src="./somafitx.jpeg"
        alt="Logo SOMAFITX"
        class="logo-principal"
      />

      <!-- Engrane girando -->
      <div class="engrane-badge" aria-hidden="true">
        <svg class="engrane-svg" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="gradEngrane" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00a8ff" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <path
            fill="url(#gradEngrane)"
            d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
          />
        </svg>
      </div>

      <!-- Monito cargando pesas -->
      <div class="lifter-badge" aria-hidden="true">
        <svg class="lifter-svg" viewBox="0 0 74 74" fill="none">
          <defs>
            <linearGradient id="gradPesas" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00a8ff" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>

          <!-- Cuerpo del monito -->
          <g class="cuerpo-monito">
            <!-- Cabeza -->
            <circle cx="37" cy="34" r="6.5" fill="#ffffff" />
            <!-- Torso -->
            <path d="M31 42.5h12l-2 15h-8l-2-15z" fill="url(#gradPesas)" />
            <!-- Piernas -->
            <path d="M33 57.5l-3 11h4.5l2.5-11h-4zM41 57.5l3 11h-4.5l-2.5-11h4z" fill="#cbd5e1" />
          </g>

          <!-- Barra y discos cargando -->
          <g class="barra-pesas">
            <!-- Brazos subiendo hacia la barra -->
            <path d="M32 44l-9-11M42 44l9-11" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
            <!-- Barra horizontal -->
            <line x1="10" y1="32" x2="64" y2="32" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round" />
            <!-- Discos izquierdos -->
            <rect x="13" y="23" width="4.5" height="18" rx="1.5" fill="url(#gradPesas)" />
            <rect x="19" y="25.5" width="3.5" height="13" rx="1.2" fill="#00a8ff" />
            <!-- Discos derechos -->
            <rect x="51.5" y="25.5" width="3.5" height="13" rx="1.2" fill="#00a8ff" />
            <rect x="56.5" y="23" width="4.5" height="18" rx="1.5" fill="url(#gradPesas)" />
          </g>
        </svg>
      </div>
    </div>

    <span class="badge-estado">En mantenimiento</span>
    <h1>Volvemos pronto</h1>
    <p>
      Estamos actualizando el catálogo y ajustando detalles en <strong>SOMAFITX</strong> para ofrecerte una mejor experiencia. Si buscas alguna prenda o cotización, escríbenos directo.
    </p>

    <div class="acciones">
      <a href="https://wa.me/525525381091" target="_blank" rel="noopener noreferrer" class="btn-principal">
        Contactar por WhatsApp
      </a>
      <a href="https://www.instagram.com/somafitx/" target="_blank" rel="noopener noreferrer" class="btn-secundario">
        Instagram @SOMAFITX
      </a>
    </div>

    <div class="lema">
      FUERZA <span>•</span> DISCIPLINA <span>•</span> RESULTADOS
    </div>
  </main>
</body>
</html>
