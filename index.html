<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOMAFITX | Sitio en Mantenimiento</title>
  <style>
    :root {
      --bg-dark: #05050b;
      --bg-card: #0b0b16;
      --text-main: #ffffff;
      --text-muted: #a3a8c2;
      --neon-purple: #8b2cf5;
      --neon-blue: #0066ff;
      --neon-cyan: #00a8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #05050a 0%, #0a0a14 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(115px);
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: var(--neon-blue);
      top: -120px;
      left: -80px;
    }

    body::after {
      background: var(--neon-purple);
      bottom: -120px;
      right: -80px;
    }

    .mantenimiento-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: rgba(11, 11, 22, 0.92);
      border: 1px solid rgba(0, 168, 255, 0.35);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: -10px 0 38px rgba(139, 44, 245, 0.32), 10px 0 38px rgba(0, 102, 255, 0.32);
    }

    .visual-wrap {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 185px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-principal {
      width: 152px;
      height: 152px;
      border-radius: 50%;
      object-fit: contain;
      background: radial-gradient(circle, #141428 0%, #05050b 100%);
      padding: 5px;
      border: 3px solid transparent;
      background-image: linear-gradient(#080812, #080812), linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 24px rgba(0, 168, 255, 0.35);
      z-index: 2;
    }

    /* Círculo izquierdo: Monito cargando pesas */
    .lifter-badge {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background: #080814;
      border: 1.5px solid rgba(139, 44, 245, 0.7);
      box-shadow: 0 0 22px rgba(139, 44, 245, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 3;
    }

    .lifter-svg {
      width: 92px;
      height: 92px;
    }

    .barra-pesas {
      animation: levantarPesas 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    .cuerpo-monito {
      animation: esfuerzoMonito 1.8s ease-in-out infinite;
      transform-origin: 37px 54px;
    }

    @keyframes levantarPesas {
      0%, 100% {
        transform: translateY(7px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes esfuerzoMonito {
      0%, 100% {
        transform: scaleY(0.95);
      }
      50% {
        transform: scaleY(1.03);
      }
    }

    /* Círculo derecho: Persona en computadora simulando mantenimiento */
    .dev-badge {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background: #080814;
      border: 1.5px solid rgba(0, 168, 255, 0.65);
      box-shadow: 0 0 22px rgba(0, 168, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 3;
    }

    .dev-svg {
      width: 90px;
      height: 90px;
    }

    .brazo-tecleo-izq {
      animation: teclearIzq 0.55s ease-in-out infinite alternate;
      transform-origin: 26px 43px;
    }

    .brazo-tecleo-der {
      animation: teclearDer 0.55s ease-in-out infinite alternate;
      transform-origin: 31px 43px;
    }

    .pantalla-brillo {
      animation: pulsoPantalla 2s ease-in-out infinite;
    }

    .codigo-linea-1 {
      animation: escribirCodigo 1.4s ease-in-out infinite;
    }

    .codigo-linea-2 {
      animation: escribirCodigo 1.4s ease-in-out 0.45s infinite;
    }

    @keyframes teclearIzq {
      from { transform: rotate(0deg); }
      to { transform: rotate(-7deg); }
    }

    @keyframes teclearDer {
      from { transform: rotate(0deg); }
      to { transform: rotate(7deg); }
    }

    @keyframes pulsoPantalla {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    @keyframes escribirCodigo {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .badge-estado {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      background: rgba(0, 168, 255, 0.1);
      border: 1px solid rgba(0, 168, 255, 0.35);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .acciones {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-principal,
    .btn-secundario {
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn-principal {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(139, 44, 245, 0.42);
    }

    .btn-secundario {
      background: rgba(17, 17, 34, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(0, 168, 255, 0.4);
    }

    .btn-principal:hover,
    .btn-secundario:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .lema {
      margin-top: 26px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    .lema span {
      color: var(--neon-purple);
      margin: 0 8px;
    }

    @media (max-width: 480px) {
      .visual-wrap {
        max-width: 340px;
        height: 150px;
      }

      .logo-principal {
        width: 120px;
        height: 120px;
      }

      .lifter-badge,
      .dev-badge {
        width: 84px;
        height: 84px;
      }

      .lifter-svg,
      .dev-svg {
        width: 74px;
        height: 74px;
      }
    }
  </style>
</head>
<body>
  <main class="mantenimiento-card">
    <div class="visual-wrap">
      <!-- Círculo izquierdo: Monito cargando pesas -->
      <div class="lifter-badge" aria-hidden="true">
        <svg class="lifter-svg" viewBox="0 0 74 74" fill="none">
          <defs>
            <linearGradient id="gradPesas" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00a8ff" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>

          <!-- Cuerpo del monito -->
          <g class="cuerpo-monito">
            <circle cx="37" cy="34" r="6.5" fill="#ffffff" />
            <path d="M31 42.5h12l-2 15h-8l-2-15z" fill="url(#gradPesas)" />
            <path d="M33 57.5l-3 11h4.5l2.5-11h-4zM41 57.5l3 11h-4.5l-2.5-11h4z" fill="#cbd5e1" />
          </g>

          <!-- Barra y discos cargando -->
          <g class="barra-pesas">
            <path d="M32 44l-9-11M42 44l9-11" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
            <line x1="10" y1="32" x2="64" y2="32" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round" />
            <rect x="13" y="23" width="4.5" height="18" rx="1.5" fill="url(#gradPesas)" />
            <rect x="19" y="25.5" width="3.5" height="13" rx="1.2" fill="#00a8ff" />
            <rect x="51.5" y="25.5" width="3.5" height="13" rx="1.2" fill="#00a8ff" />
            <rect x="56.5" y="23" width="4.5" height="18" rx="1.5" fill="url(#gradPesas)" />
          </g>
        </svg>
      </div>

      <!-- Logo principal al centro -->
      <img
        src="./somafitx.jpeg"
        alt="Logo SOMAFITX"
        class="logo-principal"
      />

      <!-- Círculo derecho: Persona en computadora simulando mantenimiento -->
      <div class="dev-badge" aria-hidden="true">
        <svg class="dev-svg" viewBox="0 0 74 74" fill="none">
          <defs>
            <linearGradient id="gradDev" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00a8ff" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>

          <!-- Escritorio -->
          <line x1="12" y1="54" x2="62" y2="54" stroke="#cbd5e1" stroke-width="2.6" stroke-linecap="round" />
          <line x1="18" y1="54" x2="18" y2="66" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />
          <line x1="56" y1="54" x2="56" y2="66" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />

          <!-- Monitor / Computadora -->
          <rect x="41" y="28" width="18" height="14" rx="2" fill="#111122" stroke="#00a8ff" stroke-width="2" class="pantalla-brillo" />
          <!-- Líneas de código en pantalla -->
          <line x1="44.5" y1="32.5" x2="53" y2="32.5" stroke="#00a8ff" stroke-width="1.8" stroke-linecap="round" class="codigo-linea-1" />
          <line x1="44.5" y1="36" x2="55.5" y2="36" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" class="codigo-linea-2" />
          <line x1="44.5" y1="39.2" x2="50.5" y2="39.2" stroke="#00a8ff" stroke-width="1.8" stroke-linecap="round" class="codigo-linea-1" />
          <!-- Base del monitor -->
          <path d="M50 42v9M45.5 51h9" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" />

          <!-- Teclado -->
          <line x1="33" y1="51.8" x2="43" y2="51.8" stroke="#00a8ff" stroke-width="2.2" stroke-linecap="round" />

          <!-- Silla -->
          <path d="M16 40v13h11" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="21" y1="53" x2="21" y2="66" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />

          <!-- Persona sentada -->
          <!-- Cabeza -->
          <circle cx="25" cy="29" r="5.5" fill="#ffffff" />
          <!-- Torso -->
          <path d="M20 37.5c0-1.5 1.2-2.5 2.8-2.5h4.2c1.4 0 2.5 1 2.7 2.4l1.3 12.6H20V37.5z" fill="url(#gradDev)" />
          <!-- Piernas sentadas -->
          <path d="M22 50h9.5l2.5 13" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Brazos tecleando -->
          <path d="M26 40l6.5 9.5h4" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="brazo-tecleo-izq" />
          <path d="M29.5 40.5l5.5 8h4.5" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="brazo-tecleo-der" />
        </svg>
      </div>
    </div>

    <span class="badge-estado">En mantenimiento</span>
    <h1>Volvemos pronto</h1>
    <p>
      Estamos actualizando el catálogo y ajustando detalles en <strong>SOMAFITX</strong> para ofrecerte una mejor experiencia. Si buscas alguna prenda o cotización, escríbenos directo.
    </p>

    <div class="acciones">
      <a href="https://wa.me/525525381091" target="_blank" rel="noopener noreferrer" class="btn-principal">
        Contactar por WhatsApp
      </a>
      <a href="https://www.instagram.com/somafitx/" target="_blank" rel="noopener noreferrer" class="btn-secundario">
        Instagram @SOMAFITX
      </a>
    </div>

    <div class="lema">
      FUERZA <span>•</span> DISCIPLINA <span>•</span> RESULTADOS
    </div>
  </main>
</body>
</html>
