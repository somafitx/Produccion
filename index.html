<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOMAFITX | Sitio en Mantenimiento</title>
  <style>
    :root {
      --bg-dark: #05050b;
      --bg-card: #0b0b16;
      --text-main: #ffffff;
      --text-muted: #a3a8c2;
      --neon-purple: #8b2cf5;
      --neon-blue: #0066ff;
      --neon-cyan: #00a8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #05050a 0%, #0a0a14 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(115px);
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: var(--neon-blue);
      top: -120px;
      left: -80px;
    }

    body::after {
      background: var(--neon-purple);
      bottom: -120px;
      right: -80px;
    }

    .mantenimiento-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: rgba(11, 11, 22, 0.92);
      border: 1px solid rgba(0, 168, 255, 0.35);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: -10px 0 38px rgba(139, 44, 245, 0.32), 10px 0 38px rgba(0, 102, 255, 0.32);
    }

    .visual-wrap {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 185px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-principal {
      width: 152px;
      height: 152px;
      border-radius: 50%;
      object-fit: contain;
      background: radial-gradient(circle, #141428 0%, #05050b 100%);
      padding: 5px;
      border: 3px solid transparent;
      background-image: linear-gradient(#080812, #080812), linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 24px rgba(0, 168, 255, 0.35);
      z-index: 2;
    }

    /* Círculo izquierdo: Monito cargando pesas */
    .lifter-badge {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background: #080814;
      border: 1.5px solid rgba(139, 44, 245, 0.7);
      box-shadow: 0 0 22px rgba(139, 44, 245, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 3;
    }

    .lifter-svg {
      width: 92px;
      height: 92px;
    }

    .barra-pesas {
      animation: levantarPesas 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    .cuerpo-monito {
      animation: esfuerzoMonito 1.8s ease-in-out infinite;
      transform-origin: 37px 54px;
    }

    @keyframes levantarPesas {
      0%, 100% {
        transform: translateY(7px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes esfuerzoMonito {
      0%, 100% {
        transform: scaleY(0.95);
      }
      50% {
        transform: scaleY(1.03);
      }
    }

    /* Círculo derecho: Persona en computadora simulando mantenimiento */
    .dev-badge {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background: #080814;
      border: 1.5px solid rgba(0, 168, 255, 0.65);
      box-shadow: 0 0 22px rgba(0, 168, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 3;
    }

    .dev-svg {
      width: 90px;
      height: 90px;
    }

    .brazo-tecleo-izq {
      animation: teclearIzq 0.55s ease-in-out infinite alternate;
      transform-origin: 26px 43px;
    }

    .brazo-tecleo-der {
      animation: teclearDer 0.55s ease-in-out infinite alternate;
      transform-origin: 31px 43px;
    }

    .pantalla-brillo {
      animation: pulsoPantalla 2s ease-in-out infinite;
    }

    .codigo-linea-1 {
      animation: escribirCodigo 1.4s ease-in-out infinite;
    }

    .codigo-linea-2 {
      animation: escribirCodigo 1.4s ease-in-out 0.45s infinite;
    }

    @keyframes teclearIzq {
      from { transform: rotate(0deg); }
      to { transform: rotate(-7deg); }
    }

    @keyframes teclearDer {
      from { transform: rotate(0deg); }
      to { transform: rotate(7deg); }
    }

    @keyframes pulsoPantalla {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    @keyframes escribirCodigo {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .badge-estado {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      background: rgba(0, 168, 255, 0.1);
      border: 1px solid rgba(0, 168, 255, 0.35);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
